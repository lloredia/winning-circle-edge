name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build API deps
        run: |
          cd services/api-server
          npm ci

      - name: Build Frontend
        run: |
          cd frontend
          npm ci
          npm run build

      - name: Docker Compose build
        run: docker compose build
