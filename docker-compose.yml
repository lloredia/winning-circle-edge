# Run with: docker compose up -d
# Stack auto-restarts on failure. Use scripts/ for auto-start on boot.

services:
  # === API SERVER: Serves picks JSON to the frontend ===
  api-server:
    build: ./services/api-server
    ports:
      - "3001:3001"
    volumes:
      - ./data:/app/data
    environment:
      - DATA_DIR=/app/data
      - PORT=3001
    restart: unless-stopped

  # === FRONTEND: React dashboard ===
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:3001
    ports:
      - "8080:8080"
    depends_on:
      - api-server
    restart: unless-stopped

  # === SCHEDULER: Runs pipeline daily at 10 AM CT ===
  scheduler:
    build:
      context: .
      dockerfile: services/scheduler/Dockerfile
    volumes:
      - ./data:/app/data
    environment:
      - ODDS_API_KEY=${ODDS_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - SPORTS=${SPORTS:-basketball_nba,basketball_ncaab,soccer_epl}
      - DATA_DIR=/app/data
      - TZ=America/Chicago
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DASHBOARD_URL=${DASHBOARD_URL}
    depends_on:
      - api-server
    restart: unless-stopped
